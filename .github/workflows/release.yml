name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: checks
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release versions
        run: |
          node --input-type=commonjs <<'NODE'
          const { readFileSync } = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME;
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
          const cargoToml = readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoSection = cargoToml
            .split(/^\[/m)
            .find((section) => section.startsWith("package]"));
          const cargo = cargoSection?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!tauri || !pkg || !cargo) {
            throw new Error("Could not read all application version sources.");
          }
          if (tauri !== pkg || cargo !== pkg) {
            throw new Error(
              `Version mismatch: tauri.conf.json=${tauri}, package.json=${pkg}, Cargo.toml=${cargo}`,
            );
          }
          if (tag !== `v${pkg}`) {
            throw new Error(`Tag ${tag} does not match application version v${pkg}.`);
          }
          console.log(`Release version validated: ${tag}`);
          NODE
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi
            echo "Reusing existing draft release $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Pomodoro $GITHUB_REF_NAME" \
              --notes "See the assets to download and install this version."
          fi
          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq '.databaseId')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Could not read the draft release id." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: windows-latest
            args: --bundles msi
          - platform: macos-14
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: matrix.platform == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
