[package]
name = "pomodoro"
version = "0.1.0"
description = "A local-first pomodoro todo desktop app"
authors = ["Pomodoro contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
rusqlite = { version = "0.41.0", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3"
